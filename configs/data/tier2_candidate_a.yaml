# CANDIDATE, not final (D2). Tier 2 held-out split, option A: "train-heavy".
# Max training data with a single val sequence.
# - test: MOT17-02 (static, heaviest occlusion) + MOT17-13 (moving bus, most small people)
# - MOT17-04 (46% of kept boxes) and MOT17-05 (640x480 / 14 FPS) are in train.
# - val is one moving sequence, so tracker tuning never sees a static camera.
name: tier2_candidate_a
tier: 2
dataset: MOT17
splits:
  train: [MOT17-04, MOT17-05, MOT17-09, MOT17-11]
  val: [MOT17-10]
  test: [MOT17-02, MOT17-13]
