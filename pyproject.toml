[project]
name = "cv-detect-track"
version = "0.1.0"
description = "Real-time multi-person detection and tracking on a 4 GB GPU: a controlled speed-accuracy study on MOT17."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "ultralytics==8.4.177",
    "lap>=0.5.12",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "tqdm>=4.66",
    # Upstream TrackEval, pinned to its last commit (2022-11-29). It uses numpy
    # aliases removed in NumPy 1.24; see cvdt.eval.trackeval_compat.
    "trackeval @ git+https://github.com/JonathonLuiten/TrackEval@12c8791b303e0a0b50f753af204249e622d0281a",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cvdt"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
